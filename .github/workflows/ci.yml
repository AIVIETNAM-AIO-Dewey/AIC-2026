name: cpu-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cpu-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Validate repository files
        run: |
          python -m json.tool notebooks/colab_object_description.ipynb > /dev/null
          python -m json.tool notebooks/kaggle_object_description.ipynb > /dev/null
          python -c "import yaml; yaml.safe_load(open('configs/models.yaml', encoding='utf-8')); yaml.safe_load(open('configs/offline/object_description.yaml', encoding='utf-8'))"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: CPU tests
        run: pytest -m "not gpu and not slow"
      - name: Online no-fusion tests
        run: python -m unittest discover -s online/tests -p 'test_nofusion.py' -v

  frontend-quality:
    name: Frontend quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Frontend syntax and DOM contract
        run: npm run lint
      - name: Frontend typecheck
        run: npm run typecheck
      - name: Frontend tests
        run: npm test
      - name: Build compiled frontend
        run: npm run build
      - name: Verify compiled frontend assets
        run: npm run verify:dist
      - name: Store compiled frontend
        uses: actions/upload-artifact@v4
        with:
          name: aic-frontend-dist
          path: online/frontend/dist
          if-no-files-found: error
          retention-days: 7
