name: cpu-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cpu-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -e "./backend[dev]"
      - name: Validate repository files
        run: |
          python -m json.tool notebooks/colab_object_description.ipynb > /dev/null
          python -m json.tool notebooks/kaggle_object_description.ipynb > /dev/null
          python -c "import yaml; yaml.safe_load(open('configs/models.yaml', encoding='utf-8')); yaml.safe_load(open('configs/offline/object_description.yaml', encoding='utf-8'))"
      - name: Ruff
        run: |
          ruff check src tests scripts backend/src backend/tests
          ruff format --check src tests scripts backend/src backend/tests
      - name: CPU tests
        run: pytest tests backend/tests -m "not gpu and not slow"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and test web client
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm test
