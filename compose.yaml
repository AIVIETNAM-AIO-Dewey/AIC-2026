services:
  qdrant:
    image: qdrant/qdrant:v1.18.2
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:6333/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    env_file:
      - path: .env
        required: false
    environment:
      AIC_QDRANT_URL: http://qdrant:6333
      AIC_ARTIFACT_ROOT: /artifacts
    volumes: ["${AIC_ARTIFACT_ROOT:-./artifacts}:/artifacts:ro"]
    ports: ["8000:8000"]
    depends_on:
      qdrant: { condition: service_healthy }
  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    ports: ["8080:80"]
    depends_on: [api]
  ingest:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    profiles: ["ingest"]
    env_file:
      - path: .env
        required: false
    environment:
      AIC_QDRANT_URL: http://qdrant:6333
    volumes: ["${AIC_ARTIFACT_ROOT:-./artifacts}:/artifacts:ro"]
    command: ["python", "-m", "aic_backend.cli.ingest", "--artifact-root", "/artifacts", "--all", "--activate", "--e5-model-path", "/artifacts/models/multilingual-e5-base"]
    depends_on:
      qdrant: { condition: service_healthy }
volumes:
  qdrant_data:
