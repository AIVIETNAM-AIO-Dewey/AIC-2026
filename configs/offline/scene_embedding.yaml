siglip_model_id: google/siglip2-base-patch16-224
siglip_revision: 75de2d55ec2d0b4efc50b3e9ad70dba96a7b2fa2

# MPS has no bfloat16. float32 keeps the index bit-comparable with a CUDA rerun;
