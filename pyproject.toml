[build-system]
requires = ["setuptools>=75.0,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "aic2026"
version = "0.1.0"
description = "Reproducible video retrieval pipeline for HCMC AI Challenge 2026"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "jsonschema==4.23.0",
  "numpy==1.26.4",
  "pillow==11.1.0",
  "pydantic==2.10.6",
  "pyyaml==6.0.2",
  "tqdm==4.67.1",
]

[project.optional-dependencies]
dev = [
  "pre-commit==4.1.0",
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "ruff==0.9.7",
  "tomli==2.2.1; python_version < '3.11'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/inspect_dam_results.py" = ["E501"]
"scripts/run_phowhisper_asr.py" = ["E501"]
"scripts/sample_dense_frames.py" = ["E501"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "gpu: requires a CUDA-capable GPU and model weights",
  "integration: exercises more than one pipeline component",
  "slow: not part of the default cloud smoke check",
]
